<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章 · 代码手记</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">&lt;/&gt;</span>
        <span class="brand-name">代码手记</span>
      </a>

      <nav class="site-nav">
        <a href="index.html" class="nav-link">首页</a>
        <a href="about.html" class="nav-link">关于</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题">
          <span class="theme-icon" data-icon="moon">🌙</span>
          <span class="theme-icon" data-icon="sun">☀️</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container article-page">
    <a href="index.html" class="back-link">← 返回文章列表</a>

    <article class="post">
      <header class="post-header">
        <h1 id="post-title" class="post-title"></h1>
        <div class="post-meta">
          <span id="post-date" class="post-date"></span>
          <span class="dot">·</span>
          <span id="post-reading-time" class="post-reading-time"></span>
        </div>
        <div id="post-tags" class="post-tags"></div>
      </header>

      <div id="post-content" class="post-content"></div>
    </article>

    <div id="post-related" class="post-related">
      <h3>相关文章</h3>
      <div id="related-list" class="article-list"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> 代码手记 · 用简单的 HTML + CSS + JS 搭建</p>
      <a href="index.html" class="footer-link">回到顶部 ↑</a>
    </div>
  </footer>

  <script src="js/articles.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
